<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · NayaDrishti AI</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e5edf8;font:16px Arial,sans-serif;padding:20px}.card{width:min(100%,420px);background:#152238;border:1px solid #2c405c;border-radius:18px;padding:30px;box-shadow:0 18px 60px #0006}h1{margin:0 0 8px;color:#67d4e8}p{color:#aebed2;line-height:1.5}input,button{width:100%;padding:14px;border-radius:10px;font-size:16px}input{background:#0b1526;border:1px solid #3b506c;color:white;margin:12px 0}button{border:0;background:#087fa5;color:white;font-weight:bold;cursor:pointer}.msg{padding:11px;border-radius:8px;margin:10px 0;background:#542d2d}.tag{color:#67d4e8;text-align:center;font-size:13px}
</style></head>
<body><main class="card"><div class="tag">नयाँ दृष्टि, नयाँ खबर।</div><h1>NayaDrishti AI</h1><p>Sign in to your Nepal news research dashboard.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label for="password">Admin password</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
</main></body></html>
