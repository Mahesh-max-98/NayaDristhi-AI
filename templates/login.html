<!DOCTYPE html>
<html>
<head>
    <title>NayaDrishti AI - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px 15px;
        }
        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            max-width: 350px;
            margin: auto;
        }
        input, button {
            padding: 13px;
            width: 90%;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }
        button {
            background: #16a085;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>NayaDrishti AI</h1>
        <p>News Research Assistant</p>
        <form method="POST">
            <input type="password" name="password"
                   placeholder="Admin Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
